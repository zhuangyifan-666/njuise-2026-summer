[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "repoproof"
version = "0.1.0"
description = "Deterministic offline-first repository release-readiness auditor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "markdown-it-py>=3,<4",
  "pathspec>=0.12,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0.2,<7",
  "rich>=13.7,<14",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.108,<7",
  "mypy>=1.11,<2",
  "pyinstaller>=6.10,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
repoproof = "repoproof.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/repoproof"]

[tool.hatch.build.targets.wheel.force-include]
"src/repoproof/profile/builtin/ai4se-b.yml" = "repoproof/profile/builtin/ai4se-b.yml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"src/repoproof/cli.py" = ["B008"]
"src/repoproof/domain.py" = ["S105"]
"src/repoproof/collectors/git.py" = ["S603", "S607"]
"tests/**/*.py" = ["S101", "S105", "S106", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["repoproof"]
